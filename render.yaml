services:
  # ---- Backend API (Node.js) ----
  - type: web
    name: vehicle-registry-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ---- Frontend (Static Site) ----
  - type: web
    name: vehicle-registry-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
